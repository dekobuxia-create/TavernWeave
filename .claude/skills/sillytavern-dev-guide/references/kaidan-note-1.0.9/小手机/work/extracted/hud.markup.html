/* 怪谈笔记 · 状态栏 v1.0.9 —— 分尺寸多主屏 + 原生式小组件编辑 */
#kdn-statusbar-root{--t1:rgba(255,255,255,.92);--t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.4);--g:#d3ad63;--b:#6ea8e6;--gl:rgba(255,255,255,.05);--gb:rgba(255,255,255,.09);--bg:#0b0e14;--shell:#05070c;--rope-color:#7d6d4f;--rope-glow-filter:none;--kdn-font-scale:1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#kdn-statusbar-root *{box-sizing:border-box;margin:0;padding:0}
#kdn-statusbar-root button{font-family:inherit}

/* ---- 可收起、可在安全视口内自由悬浮的手机壳 ---- */
#kdn-statusbar-root .kdn-drawer{position:fixed;top:0;left:0;z-index:3004;width:330px;max-width:calc(100vw - 16px);background:var(--shell);border-radius:38px;padding:10px;border:.5px solid rgba(255,255,255,.1);box-shadow:0 0 0 2px #16181f,0 18px 50px rgba(0,0,0,.55);transform:translate3d(-200vw,-200vh,0);will-change:transform;user-select:none}
#kdn-statusbar-root .kdn-screen{position:relative;background-color:var(--bg);background-position:center;background-size:cover;background-repeat:no-repeat;border-radius:29px;overflow:hidden;clip-path:inset(0 round 29px);isolation:isolate;height:560px;display:flex;flex-direction:column;container-type:inline-size}
#kdn-statusbar-root .kdn-stat{cursor:grab;touch-action:none}
#kdn-statusbar-root .kdn-drawer.kdn-dragging .kdn-stat{cursor:grabbing}
#kdn-statusbar-root [data-kdn="floatgrab"]{cursor:move;touch-action:none;color:var(--g);padding:2px;border-radius:5px}

/* ---- 挂饰:verlet 分段绳(svg·纯色描边) + 末端吊牌(JS 定位) ---- */
#kdn-statusbar-root .kdn-charm{position:absolute;top:100%;right:30px;width:0;height:0;user-select:none;touch-action:none}
#kdn-statusbar-root .kdn-rope{position:absolute;left:-50px;top:0;overflow:visible;pointer-events:none;filter:var(--rope-glow-filter);transition:filter .18s ease}
#kdn-statusbar-root .kdn-rope polyline{stroke:var(--rope-color);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
#kdn-statusbar-root .kdn-charm-tag{position:absolute;top:0;left:0;width:30px;height:38px;border-radius:8px;background:linear-gradient(160deg,#171a22,#0d0f16);border:1px solid rgba(211,173,99,.55);display:flex;align-items:center;justify-content:center;color:var(--g);font-size:16px;font-size:calc(16px * var(--kdn-font-scale));transform-origin:top center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));will-change:transform;cursor:grab;touch-action:none}
#kdn-statusbar-root .kdn-drawer.kdn-dragging .kdn-charm-tag{cursor:grabbing}
#kdn-statusbar-root .kdn-charm-bead{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#8a3b3b;box-shadow:0 0 5px rgba(178,90,90,.6)}
#kdn-statusbar-root[data-kdn-charm="seal"] .kdn-charm-tag,#kdn-statusbar-root[data-kdn-charm="crystal"] .kdn-charm-tag,#kdn-statusbar-root[data-kdn-charm="keycard"] .kdn-charm-tag{width:30px}
#kdn-statusbar-root[data-kdn-charm="seal"] .kdn-charm-tag>i,#kdn-statusbar-root[data-kdn-charm="crystal"] .kdn-charm-tag>i,#kdn-statusbar-root[data-kdn-charm="keycard"] .kdn-charm-tag>i{display:none}
#kdn-statusbar-root[data-kdn-charm="seal"] .kdn-charm-tag{height:42px;border-radius:3px 3px 9px 9px;background:linear-gradient(180deg,#3a2916,#17100a);border-color:rgba(226,174,82,.72);color:#e1b45d}
#kdn-statusbar-root[data-kdn-charm="seal"] .kdn-charm-tag::before{content:"封";font-family:STKaiti,"KaiTi",serif;font-size:17px;font-size:calc(17px * var(--kdn-font-scale));text-shadow:0 0 8px rgba(224,165,70,.52)}
#kdn-statusbar-root[data-kdn-charm="crystal"] .kdn-charm-tag{height:44px;clip-path:polygon(46% 0,82% 9%,100% 56%,74% 100%,24% 94%,0 47%,17% 13%);border:0;border-radius:0;background:linear-gradient(148deg,rgba(229,255,255,.96) 0 8%,transparent 9% 100%),linear-gradient(27deg,#102747 0 28%,#246f9a 29% 48%,#63dce0 49% 63%,#2f789f 64% 76%,#0a1732 77% 100%);box-shadow:inset 0 0 0 1px rgba(156,245,255,.38);filter:drop-shadow(0 4px 9px rgba(0,0,0,.62)) drop-shadow(0 0 7px rgba(83,218,238,.45))}
#kdn-statusbar-root[data-kdn-charm="crystal"] .kdn-charm-tag::before{content:"";position:absolute;inset:3px 4px 4px;clip-path:polygon(44% 0,78% 13%,100% 54%,69% 100%,21% 91%,0 46%,17% 12%);background:linear-gradient(108deg,rgba(238,255,255,.86) 0 10%,transparent 11% 39%,rgba(137,247,255,.48) 40% 45%,transparent 46%),linear-gradient(160deg,rgba(75,208,225,.3),rgba(8,22,54,.74))}
#kdn-statusbar-root[data-kdn-charm="crystal"] .kdn-charm-tag::after{content:"";position:absolute;left:10px;top:8px;width:10px;height:27px;clip-path:polygon(50% 0,100% 39%,66% 100%,29% 91%,0 38%);background:linear-gradient(180deg,#f4ffff 0,#8cffff 24%,#39c8e1 58%,#3563a2 100%);filter:drop-shadow(0 0 4px rgba(151,251,255,.9));animation:kdn-crystal-core 2.4s ease-in-out infinite}
@keyframes kdn-crystal-core{0%,100%{opacity:.72;filter:drop-shadow(0 0 3px rgba(151,251,255,.72))}50%{opacity:1;filter:drop-shadow(0 0 7px rgba(151,251,255,1))}}
#kdn-statusbar-root[data-kdn-charm="crystal"] .kdn-charm-bead{display:none}
#kdn-statusbar-root[data-kdn-charm="keycard"] .kdn-charm-tag{height:38px;clip-path:polygon(0 0,23px 0,30px 7px,30px 38px,0 38px);border:0;border-radius:0;background:linear-gradient(160deg,#27313b,#0c1319);box-shadow:inset 0 0 0 1px rgba(103,220,208,.52);color:#72d9ce}
#kdn-statusbar-root[data-kdn-charm="keycard"] .kdn-charm-tag::before{content:"KDN";font:700 8px/1 Consolas,monospace;letter-spacing:1px}
#kdn-statusbar-root[data-kdn-charm="keycard"] .kdn-charm-bead{left:5px;bottom:5px;transform:none;width:4px;height:4px;background:#70e4a4;box-shadow:0 0 6px rgba(112,228,164,.9)}
#kdn-statusbar-root[data-kdn-shell="terminal"]{--g:#6bc7f2;--b:#4be4ff;--gl:rgba(3,15,24,.1);--gb:rgba(61,157,194,.46);--bg:rgba(2,11,18,.16);--shell:transparent;--t1:#d9f4ff;--t2:#b8d9e8;--t3:#6f9daf;--kdn-terminal-cut:14px;--kdn-terminal-cut-sm:8px;--kdn-terminal-cut-xs:5px}
