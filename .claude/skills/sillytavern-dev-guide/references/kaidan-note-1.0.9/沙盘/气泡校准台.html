<title>气泡校准台</title>
<style>
  /* 工具皮（单主题深色工作台——校准对象为深色气泡，环境必须深，刻意单主题） */
  :root{
    --bg:#16181d; --stage:#141419; --panel:#1b1e25; --panel2:#20242d;
    --line:#2a2e39; --line2:#343a47;
    --txt:#d9dde5; --dim:#8b93a4; --faint:#5c6373;
    --acc:#d8a656; --acc-dim:rgba(216,166,86,.16);
    --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
    --ui:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:13px/1.5 var(--ui)}
  ::selection{background:rgba(216,166,86,.3)}

  header{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9;flex-wrap:wrap}
  header h1{font:600 14px/1 var(--ui);margin:0;letter-spacing:.5px}
  .seg{display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--dim);font:12px var(--ui);padding:5px 11px;cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--acc-dim);color:var(--acc)}
  .seg button:focus-visible,button:focus-visible{outline:1px solid var(--acc);outline-offset:-1px}
  #schemeseg button{font-weight:600;padding:6px 14px}
  .sp{flex:1}
  .btn{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);font:12px var(--ui);padding:5px 12px;border-radius:5px;cursor:pointer}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .btn.pri{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}

  main{display:flex;height:calc(100vh - 43px)}
  #stagewrap{flex:1;overflow:auto;padding:26px 20px;display:flex;justify-content:center;align-items:flex-start}

  /* ―― 仿 ST 聊天楼层环境 ―― */
  #pv{width:100%;max-width:900px;background:var(--stage);border:1px solid #23232b;border-radius:8px;padding:4px 0 12px;font-family:"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif}
  #pv.w640{max-width:640px} #pv.w380{max-width:380px}
  .st-msg{display:flex;gap:12px;padding:14px 16px}
  .st-ava{width:42px;height:42px;border-radius:50%;flex:0 0 42px;background:linear-gradient(135deg,#2c3444,#1b2130);display:grid;place-items:center;color:#7f8ba0;font-size:16px}
  .st-main{flex:1;min-width:0}
  .st-name{font-size:13px;color:#c8cede;font-weight:600;margin-bottom:6px}
  .st-name small{color:#565d6d;font-weight:400;margin-left:8px;font-size:11px}
  .st-body{color:#d4d4d4;font-size:14px;line-height:1.7}
  .st-body>p{margin:8px 2px}
  .cot-tag{display:inline-block;font:10px var(--mono);color:#6b7385;border:1px dashed #3a4150;border-radius:4px;padding:2px 7px;margin:14px 0 2px;letter-spacing:.5px}
  #pv .hint{color:#4c5361;font-size:11px;text-align:center;margin-top:10px}

  /* ―― 参数面板 ―― */
  aside{width:340px;flex:0 0 340px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
  #schemedesc{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.6}
  #schemedesc b{color:var(--acc);display:block;margin-bottom:3px;font-size:12px}
  .rows{padding:8px 12px 12px}
  .row{display:grid;grid-template-columns:96px 1fr 52px;gap:8px;align-items:center;padding:3px 0}
  .row label{font-size:12px;color:var(--dim);white-space:nowrap}
  input[type=range]{width:100%;accent-color:var(--acc);height:22px;background:transparent}
  .row .num{width:52px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);font:11px var(--mono);padding:3px 5px;border-radius:4px;text-align:right}
  .row .num:focus{border-color:var(--acc);outline:none}
  .crow{display:grid;grid-template-columns:96px 34px 1fr 52px;gap:8px;align-items:center;padding:3px 0}
  .crow label{font-size:12px;color:var(--dim)}
  .crow input[type=color]{width:34px;height:24px;border:1px solid var(--line2);border-radius:4px;background:none;padding:1px;cursor:pointer}
  .crow .num{width:52px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);font:11px var(--mono);padding:3px 5px;border-radius:4px;text-align:right}
  .chk{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12px;color:var(--dim)}
  .chk input{accent-color:var(--acc)}

  #csswrap{border-top:1px solid var(--line);margin-top:auto}
  #csswrap .head{display:flex;align-items:center;gap:8px;padding:8px 12px}
  #csswrap .head b{font:600 12px var(--ui);color:var(--dim);letter-spacing:1px}
  #cssout{display:block;width:100%;background:#12141a;border:none;border-top:1px solid var(--line);color:#9fb3c8;font:10.5px/1.6 var(--mono);padding:10px 12px;height:200px;resize:vertical;white-space:pre;overflow:auto}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);color:var(--acc);font:12px var(--ui);padding:7px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
  #toast.show{opacity:1}
  @media(max-width:860px){main{flex-direction:column;height:auto}aside{width:100%;flex:none;border-left:none;border-top:1px solid var(--line)}#stagewrap{padding:14px 10px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <h1>气泡校准台</h1>
  <div class="seg" id="schemeseg" role="group" aria-label="设计方案"></div>
  <div class="seg" id="wseg" role="group" aria-label="预览宽度">
    <button data-w="" class="on">全宽</button><button data-w="w640">640</button><button data-w="w380">380</button>
  </div>
  <span class="sp"></span>
  <button class="btn" id="resetbtn">重置本方案</button>
  <button class="btn pri" id="copybtn">复制 CSS</button>
</header>

<main>
  <section id="stagewrap"><div id="pv"></div></section>
  <aside>
    <div id="schemedesc"></div>
    <div id="panel"></div>
    <div id="csswrap">
      <div class="head"><b>bubble.css 输出（实装照抄）</b></div>
      <textarea id="cssout" readonly spellcheck="false" aria-label="生成的 CSS"></textarea>
    </div>
  </aside>
</main>
<div id="toast" role="status">已复制</div>

<script>
'use strict';
/* =============================================================================
 * 方案引擎：每个方案 = 完整独立设计（名字艺术字 + 头像↔气泡视觉绑定 + 材质），
 * 同一 DOM（星月 buildDialogBubbleEl 结构），纯 CSS 落地。
 * ============================================================================= */
const $=s=>document.querySelector(s);
function rgba(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  const av=(+a).toFixed(2).replace(/^0/,'').replace(/\.?0+$/,'')||'0';
  return 'rgba('+r+','+g+','+b+','+(av===''?'0':(av==='1'?'1':av))+')';}
function hexMix(hex,hex2,t){const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(hex),b=p(hex2);const m=a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  return '#'+m.map(v=>v.toString(16).padStart(2,'0')).join('');}
function fmt(v){return (''+v).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');}

/* ---------- 方案定义 ---------- */
const SCHEMES={

/* ============ B · 霜镜（玻璃拟态：磨砂面板+发光徽章头像+光点名字） ============ */
glass:{
  label:'霜镜',
  desc:'真磨砂玻璃面板（backdrop blur+顶缘高光），头像是叠进玻璃边缘的发光徽章——负 margin 压进气泡 + 同色光环，气泡左上角为头像让出大弧。名字细字距+角色色光点。',
  params:{
    cNpc:{t:'c',label:'NPC 光色',def:'#7fc9ff'},
    cUser:{t:'c',label:'user 光色',def:'#ffa1e0'},
    blur:{label:'磨砂强度',def:14,min:4,max:28,step:1},
    white:{label:'玻璃亮度',def:.07,min:.02,max:.2,step:.01},
    r:{label:'圆角',def:18,min:8,max:28,step:1},
    sink:{label:'头像叠入',def:14,min:0,max:26,step:1},
    av:{label:'头像尺寸',def:46,min:36,max:64,step:1},
    fs:{label:'台词字号',def:12,min:0,max:16,step:1},
    anim:{label:'动效档 0-2',def:2,min:0,max:2,step:1},
  },
  gen(p){
    const side=(c,user)=>{
      const sel=user?'.xy-dialog-user':'.xy-dialog-npc';
      return [
        [sel+' .xy-dialog-avatar img','border-color:'+rgba(c,.65)],
        [sel+' .xy-dialog-avatar','box-shadow:0 0 0 3px '+rgba(c,.14)+',0 6px 18px '+rgba(c,.22)],
        [sel+' .xy-dialog-avatar::after','border-color:'+rgba(c,.55)],
        [sel+' .xy-dialog-speaker::before','background:'+c+';box-shadow:0 0 9px '+rgba(c,.9)+',0 0 2px '+rgba(c,1)+(p.anim>=2?';animation:xyGlPulse 2.6s ease-in-out infinite'+(user?' 1.1s':''):'')],
        [sel+' .xy-dialog-text','box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px '+rgba(c,.1)+',0 10px 30px rgba(0,0,0,.28)'],
      ];
    };
    const anims=[];
    if(p.anim>=1){
      anims.push(['@keyframes xyGlIn{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}','']);
      anims.push(['.xy-dialog-bubble-wrap','animation:xyGlIn .36s cubic-bezier(.16,1,.3,1) both']);
    }
    if(p.anim>=2){
      /* TW·Aceternity「Moving Border」的柔化变体：头像外环呼吸扩散 + 光点脉冲 */
      anims.push(['@keyframes xyGlRing{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:.12}}','']);
      anims.push(['@keyframes xyGlPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.8)}}','']);
      anims.push(['.xy-dialog-avatar::after','content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid;animation:xyGlRing 3s ease-in-out infinite']);
    }
    return [...anims,
      ['.xy-dialog-bubble-wrap','display:flex;gap:2px;align-items:flex-start;margin:11px 0;max-width:100%'],
      ['.xy-dialog-bubble-wrap.xy-dialog-user','flex-direction:row-reverse'],
      /* 头像徽章：正圆双环，压进玻璃 */
      ['.xy-dialog-avatar','position:relative;z-index:1;width:'+p.av+'px;height:'+p.av+'px;flex:0 0 '+p.av+'px;border-radius:50%;background:rgba(10,16,24,.6);padding:3px;margin-top:2px'],
      ['.xy-dialog-avatar img','width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;border:1.5px solid'],
      ['.xy-dialog-npc .xy-dialog-avatar','margin-right:-'+p.sink+'px'],
      ['.xy-dialog-user .xy-dialog-avatar','margin-left:-'+p.sink+'px'],
      ['.xy-dialog-body','min-width:0;max-width:min(84ch,calc(100% - '+(p.av+10)+'px))'],
      /* 名字：光点 + 细字 + 宽字距，悬在玻璃上缘 */
      ['.xy-dialog-speaker','display:flex;align-items:center;gap:6px;margin:0 0 4px '+(p.sink+14)+'px;font-size:11px;font-weight:500;letter-spacing:1.5px;color:rgba(235,245,255,.92)'],
      ['.xy-dialog-user .xy-dialog-speaker','flex-direction:row-reverse;margin-left:0;margin-right:'+(p.sink+14)+'px'],
      ['.xy-dialog-speaker::before','content:"";width:5px;height:5px;flex:0 0 5px;border-radius:50%'],
      /* 玻璃面板：blur+饱和提升，头像侧留 padding，为头像开大弧角 */
      ['.xy-dialog-text','background:rgba(255,255,255,'+fmt(p.white)+');backdrop-filter:blur('+p.blur+'px) saturate(1.5);-webkit-backdrop-filter:blur('+p.blur+'px) saturate(1.5);border:1px solid rgba(255,255,255,.16);border-radius:'+Math.round(p.r*1.6)+'px '+p.r+'px '+p.r+'px '+p.r+'px;padding:10px 15px 11px '+(p.sink+15)+'px'+(p.fs>0?';font-size:'+p.fs+'px':'')+';color:rgba(240,248,255,.97);line-height:1.75;white-space:pre-wrap;word-break:break-word'],
      ['.xy-dialog-user .xy-dialog-text','background:rgba(255,214,243,'+fmt(Math.max(.02,p.white-.01))+');border-radius:'+p.r+'px '+Math.round(p.r*1.6)+'px '+p.r+'px '+p.r+'px;padding:10px '+(p.sink+15)+'px 11px 15px'],
      ...side(p.cNpc,false),...side(p.cUser,true),
      ['.xy-dialog-narration','margin:9px 2px;color:rgba(226,240,248,.85);line-height:1.75;white-space:pre-wrap;word-break:break-word'],
      ['@media(max-width:640px){.xy-dialog-avatar{width:40px;height:40px;flex-basis:40px}.xy-dialog-text{padding-top:9px;padding-bottom:10px}}',''],
    ];
  },
},

/* ============ C · 鎏金档案（暗夜奢华：衬线金字名 + 签名金线贯穿头像与面板） ============ */
gilt:{
  label:'鎏金档案',
  desc:'近黑丝绒面板 + 细金双线框。名字是衬线体鎏金字，一条签名金线从头像底部延伸横贯气泡顶缘——头像像蜡封印章按在这条线上。user 侧玫瑰金变体。',
  params:{
    gold:{t:'c',label:'NPC 金',def:'#d4af6e'},
    rose:{t:'c',label:'user 玫瑰金',def:'#d98aa4'},
    bgA:{label:'底浓度',def:.9,min:.6,max:1,step:.02},
    r:{label:'圆角',def:4,min:0,max:14,step:1},
    lineW:{label:'签名线粗',def:1,min:1,max:2,step:.5},
    av:{label:'头像尺寸',def:44,min:36,max:60,step:1},
    fs:{label:'台词字号',def:12,min:0,max:16,step:1},
    anim:{label:'动效档 0-2',def:2,min:0,max:2,step:1},
  },
  gen(p){
    const side=(c,user)=>{
      const sel=user?'.xy-dialog-user':'.xy-dialog-npc';
      return [
        [sel+' .xy-dialog-avatar','border-color:'+rgba(c,.6)+';box-shadow:0 0 0 1px '+rgba(c,.18)+',0 4px 14px rgba(0,0,0,.4)'],
        [sel+' .xy-dialog-avatar::after','background:linear-gradient(to bottom,'+rgba(c,.7)+','+rgba(c,.15)+')'],
        /* TW·Magic UI「Animated Gradient Text」正统用法：鎏金渐变字缓慢流动（档2） */
        [sel+' .xy-dialog-speaker','background:linear-gradient(100deg,'+c+' 20%,'+hexMix(c,'#fff8ea',.55)+' 50%,'+c+' 80%);-webkit-background-clip:text;background-clip:text;color:transparent'+(p.anim>=2?';background-size:240% 100%;animation:xyGtFlow 5s linear infinite'+(user?' 1.4s':''):'')],
        [sel+' .xy-dialog-speaker::after','background:linear-gradient(to '+(user?'left':'right')+','+rgba(c,.55)+','+rgba(c,.08)+')'],
        [sel+' .xy-dialog-text','border-color:'+rgba(c,.34)+';box-shadow:inset 0 0 0 1px '+rgba(c,.1)+',0 6px 22px rgba(0,0,0,.35)'],
        [sel+' .xy-dialog-text::before','background:linear-gradient(to bottom,'+rgba(c,.75)+','+rgba(c,.1)+')'+(p.anim>=2?';animation:xyGtBreath 4.2s ease-in-out infinite':'')],
      ];
    };
    const anims=[];
    if(p.anim>=1){
      anims.push(['@keyframes xyGtIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}','']);
      anims.push(['@keyframes xyGtLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}','']);
      anims.push(['@keyframes xyGtDrop{from{transform:scaleY(0)}to{transform:scaleY(1)}}','']);
      anims.push(['.xy-dialog-bubble-wrap','animation:xyGtIn .4s ease-out both']);
      /* 签名线书写展开：横线从名字侧划出，头像垂线随后落下 */
      anims.push(['.xy-dialog-speaker::after','transform-origin:left center;animation:xyGtLine .55s .12s cubic-bezier(.22,1,.36,1) both']);
      anims.push(['.xy-dialog-user .xy-dialog-speaker::after','transform-origin:right center']);
      anims.push(['.xy-dialog-avatar::after','transform-origin:top center;animation:xyGtDrop .4s .5s ease-out both']);
    }
    if(p.anim>=2){
      anims.push(['@keyframes xyGtFlow{0%{background-position:0% 0}100%{background-position:240% 0}}','']);
      anims.push(['@keyframes xyGtBreath{0%,100%{opacity:1}50%{opacity:.55}}','']);
    }
    return [...anims,
      ['.xy-dialog-bubble-wrap','display:flex;gap:0;align-items:flex-start;margin:12px 0;max-width:100%'],
      ['.xy-dialog-bubble-wrap.xy-dialog-user','flex-direction:row-reverse'],
      /* 头像：方正小圆角细金框；::after 是从头像底部垂下的金线杆（接签名线） */
      ['.xy-dialog-avatar','position:relative;width:'+p.av+'px;height:'+p.av+'px;flex:0 0 '+p.av+'px;border-radius:6px;border:1px solid;padding:2px;background:rgba(8,8,10,.65)'],
      ['.xy-dialog-avatar img','width:100%;height:100%;object-fit:cover;display:block;border-radius:4px;filter:saturate(.92) contrast(1.04)'],
      ['.xy-dialog-avatar::after','content:"";position:absolute;top:10px;bottom:-4px;right:-9px;width:'+fmt(p.lineW)+'px'],
      ['.xy-dialog-user .xy-dialog-avatar::after','right:auto;left:-9px'],
      ['.xy-dialog-body','min-width:0;max-width:min(84ch,calc(100% - '+(p.av+18)+'px));padding-'+'left:18px'],
      ['.xy-dialog-user .xy-dialog-body','padding-left:0;padding-right:18px'],
      /* 名字：衬线鎏金渐变字 + 延伸金线（与头像垂线相接成 L 形签名线） */
      ['.xy-dialog-speaker','display:flex;align-items:baseline;gap:10px;margin:0 0 6px;font-family:Georgia,"Times New Roman","STSong","SimSun",serif;font-size:13.5px;font-weight:700;letter-spacing:3px'],
      ['.xy-dialog-user .xy-dialog-speaker','flex-direction:row-reverse'],
      ['.xy-dialog-speaker::after','content:"";height:'+fmt(p.lineW)+'px;flex:1;align-self:center;margin-top:2px'],
      /* 面板：近黑丝绒 + 细金框 + 左缘金竖条 */
      ['.xy-dialog-text','position:relative;background:'+rgba('#131015',p.bgA)+';border:1px solid;border-radius:'+p.r+'px;padding:11px 16px 12px 18px'+(p.fs>0?';font-size:'+p.fs+'px':'')+';color:rgba(243,238,230,.95);line-height:1.85;white-space:pre-wrap;word-break:break-word'],
      ['.xy-dialog-text::before','content:"";position:absolute;left:-1px;top:'+(p.r+2)+'px;bottom:'+(p.r+2)+'px;width:2px'],
      ['.xy-dialog-user .xy-dialog-text','background:'+rgba('#171016',p.bgA)],
      ['.xy-dialog-user .xy-dialog-text::before','left:auto;right:-1px'],
      ...side(p.gold,false),...side(p.rose,true),
      ['.xy-dialog-narration','margin:10px 2px;color:rgba(232,226,216,.82);line-height:1.85;white-space:pre-wrap;word-break:break-word'],
      ['@media(max-width:640px){.xy-dialog-avatar{width:38px;height:38px;flex-basis:38px}.xy-dialog-body{padding-left:14px}.xy-dialog-user .xy-dialog-body{padding-left:0;padding-right:14px}.xy-dialog-text{padding:10px 13px 11px 15px}}',''],
    ];
  },
},

/* ============ D · 墨线分镜（漫画：描边气泡+真尾巴+斜贴名牌+描边头像） ============ */
manga:{
  label:'墨线分镜',
  desc:'漫画分镜语言：粗描边气泡 + 双层真尾巴咬住头像，名字是斜贴的实色名牌（角色色块+硬阴影）压在气泡与头像的接缝上——名牌本身就是两者的锁扣。',
  params:{
    cNpc:{t:'c',label:'NPC 牌色',def:'#3d9dd8'},
    cUser:{t:'c',label:'user 牌色',def:'#d85f9e'},
    ink:{t:'c',label:'描边墨色',def:'#e8ecf2'},
    inkW:{label:'描边粗',def:2,min:1,max:3,step:.5},
    r:{label:'圆角',def:13,min:4,max:22,step:1},
    tail:{label:'尾巴大小',def:9,min:6,max:14,step:1},
    av:{label:'头像尺寸',def:48,min:38,max:64,step:1},
    fs:{label:'台词字号',def:12,min:0,max:16,step:1},
    anim:{label:'动效档 0-1',def:1,min:0,max:1,step:1},
  },
  gen(p){
    const ink=p.ink, iw=fmt(p.inkW), t=p.tail, bgN='#20242c', bgU='#2a2029';
    const anims=[];

/* ============ E · PERSONA（P5 本体语言：黑纸白字+白粗轮廓+错位红衬+定格躁动） ============ */
p5:{
  label:'PERSONA',
  desc:'照 P5 本体重做：黑色斜切纸片+白色粗轮廓（跟形状）+错位红衬，白牌黑字歪斜名牌拍在接缝上；user 红纸白字反转。全员带定格动画式躁动——没有一个元素肯站直。形状 SVG mask 抗锯齿，轮廓与衬影走 drop-shadow 链。',
  params:{
    red:{t:'c',label:'P5 红',def:'#e60012'},
    paper:{t:'c',label:'NPC 纸色',def:'#141317'},
    uPaper:{t:'c',label:'user 纸色',def:'#ad0912'},
    outline:{t:'c',label:'轮廓白',def:'#f5f2ec'},
    outW:{label:'轮廓粗',def:2.5,min:1.5,max:4,step:.5},
    shift:{label:'错位深度',def:5,min:2,max:8,step:.5},
    wild:{label:'歪斜狂度',def:.6,min:0,max:1,step:.05},
    jitter:{label:'躁动幅度',def:.35,min:0,max:.8,step:.05},
    av:{label:'头像尺寸',def:52,min:40,max:66,step:1},
    fs:{label:'台词字号',def:12,min:0,max:16,step:1},
    anim:{label:'动效档 0-2',def:2,min:0,max:2,step:1},
  },
  gen(p){
    const w=p.wild, red=p.red, o=p.outline, ow=fmt(p.outW), sh=fmt(p.shift), sh2=fmt(Math.round(p.shift*1.25*10)/10);
    /* SVG data-URI mask（抗锯齿远好于 clip-path）；斜切度钳在文字安全区内 */
    const svgMask=(pts,m)=>{
      const P=pts.map(([x,y])=>fmt(Math.round((m?100-x:x)*10)/10)+','+fmt(Math.round(y*10)/10)).join(' ');
      return 'url("data:image/svg+xml;charset=utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="'+P+'"/></svg>')+'") 0 0/100% 100% no-repeat';
    };
    const maskLine=v=>'-webkit-mask:'+v+';mask:'+v;
    const paperPts=[[0,2.5+3*w],[99.2,0],[100,8+4*w],[100,91-3*w],[1.5,100],[0,94]];
    const avaPts=[[10,0],[100,3],[88,100],[0,97]];
    const tailMask=m=>maskLine('url("data:image/svg+xml;charset=utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="'+(m?'100,0 0,45 72,100':'0,0 100,45 28,100')+'"/></svg>')+'") 0 0/100% 100% no-repeat');
    /* 白粗轮廓 = 四向实色 drop-shadow；最后一层 = 错位衬影。全部跟随 mask 形状（含尾巴）。 */
    const outlineChain=c=>'drop-shadow('+ow+'px 0 0 '+o+') drop-shadow(-'+ow+'px 0 0 '+o+') drop-shadow(0 '+ow+'px 0 '+o+') drop-shadow(0 -'+ow+'px 0 '+o+') drop-shadow('+sh+'px '+sh2+'px 0 '+c+')';
    const tilt=fmt(-(2.5+3*w)), tiltU=fmt(2.5+3*w);
    const side=(paper,txt,tagBg,tagTxt,shadowC,user)=>{
      const sel=user?'.xy-dialog-user':'.xy-dialog-npc';
      return [
        [sel+' .xy-dialog-text','background:'+paper+';color:'+txt+';'+maskLine(svgMask(paperPts,user))],
        [sel+' .xy-dialog-body','filter:'+outlineChain(shadowC)],
        [sel+' .xy-dialog-avatar','filter:'+outlineChain(shadowC)],
        [sel+' .xy-dialog-speaker','background:'+tagBg+';color:'+tagTxt+';box-shadow:3px 3px 0 '+red],
        [sel+' .xy-dialog-text::after','background:'+paper+';'+(user?'right:-11px':'left:-11px')+';'+tailMask(user)],
        [sel+' .xy-dialog-avatar img',maskLine(svgMask(avaPts,user))],
      ];
    };
    const anims=[];
    if(p.anim>=1){
      anims.push(['@keyframes xyP5In{from{opacity:0;transform:translateX(var(--fly,-20px)) skewX(var(--sk,-6deg)) rotate(var(--ro,-1deg))}62%{opacity:1;transform:translateX(calc(var(--fly,-20px) * -.14)) skewX(calc(var(--sk,-6deg) * -.3)) rotate(calc(var(--ro,-1deg) * -.4))}to{opacity:1;transform:none}}','']);
      anims.push(['@keyframes xyP5Tag{from{opacity:0;transform:rotate(calc(var(--tilt) * 3.2)) scale(.35)}62%{opacity:1;transform:rotate(var(--tilt)) scale(1.18)}to{opacity:1;transform:rotate(var(--tilt)) scale(1)}}','']);
      anims.push(['.xy-dialog-bubble-wrap','--fly:-20px;--sk:-6deg;--ro:-1deg;animation:xyP5In .32s cubic-bezier(.2,1.25,.4,1) both']);
      anims.push(['.xy-dialog-bubble-wrap.xy-dialog-user','--fly:20px;--sk:6deg;--ro:1deg']);
      anims.push(['.xy-dialog-speaker','animation:xyP5Tag .38s .06s cubic-bezier(.3,1.6,.5,1) both'+(p.anim>=2?',xyP5Sway 2.9s .5s ease-in-out infinite':'')]);
    }
    if(p.anim>=2&&p.jitter>0){
      const j=v=>fmt(Math.round(v*100)/100);
      /* 定格动画式躁动：两态硬切（拼贴纸片贴不平的感觉），三件套周期错开 */
      anims.push(['@keyframes xyP5JitA{0%,49.9%{transform:rotate('+j(p.jitter)+'deg)}50%,100%{transform:rotate(-'+j(p.jitter*.8)+'deg)}}','']);
      anims.push(['@keyframes xyP5JitB{0%,49.9%{transform:rotate(-'+j(p.jitter*.7)+'deg)}50%,100%{transform:rotate('+j(p.jitter)+'deg)}}','']);
      anims.push(['@keyframes xyP5Sway{0%,100%{transform:rotate(calc(var(--tilt) - '+j(p.jitter*1.6)+'deg)) scale(1)}50%{transform:rotate(calc(var(--tilt) + '+j(p.jitter*2)+'deg)) scale(1)}}','']);
      anims.push(['.xy-dialog-text','animation:xyP5JitA 1.7s steps(1) infinite']);
      anims.push(['.xy-dialog-avatar img','animation:xyP5JitB 2.3s steps(1) infinite']);
    } else if(p.anim>=1){
      anims.push(['@keyframes xyP5Sway{0%,100%{transform:rotate(var(--tilt)) scale(1)}50%{transform:rotate(var(--tilt)) scale(1)}}','']);
    }
    return [...anims,
      ['.xy-dialog-bubble-wrap','display:flex;gap:15px;align-items:flex-start;margin:15px 0;max-width:100%'],
      ['.xy-dialog-bubble-wrap.xy-dialog-user','flex-direction:row-reverse'],
      /* 头像：斜切 mask + 白轮廓/红衬（filter 链，抗锯齿跟形） */
      ['.xy-dialog-avatar','position:relative;width:'+p.av+'px;height:'+p.av+'px;flex:0 0 '+p.av+'px;background:none'],
      ['.xy-dialog-avatar img','width:100%;height:100%;object-fit:cover;display:block'],
      ['.xy-dialog-body','position:relative;min-width:0;max-width:min(82ch,calc(100% - '+(p.av+22)+'px));padding-top:12px'],
      /* 名牌：白牌黑字（P5 人名牌），歪斜更狠，拍在接缝上 */
      ['.xy-dialog-speaker','position:absolute;top:-4px;left:-7px;z-index:2;margin:0;padding:2px 13px 3px;font-size:12.5px;font-weight:900;font-style:italic;letter-spacing:2px;--tilt:'+tilt+'deg;transform:rotate(var(--tilt));max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'],
      ['.xy-dialog-user .xy-dialog-speaker','left:auto;right:-7px;--tilt:'+tiltU+'deg'],
      /* 纸片本体：黑纸白字（P5 本体），尾巴同纸色，轮廓与衬影由 body 的 filter 统一投 */
      ['.xy-dialog-text','position:relative;padding:15px 17px 13px 18px'+(p.fs>0?';font-size:'+p.fs+'px':'')+';font-weight:600;line-height:1.72;white-space:pre-wrap;word-break:break-word'],
      ['.xy-dialog-user .xy-dialog-text','padding:15px 18px 13px 17px'],
      ['.xy-dialog-text::after','content:"";position:absolute;top:17px;width:14px;height:13px'],
      ...side(p.paper,'#f7f5f0',o,'#16141a',red,false),
      ...side(p.uPaper,'#fff','#16141a','#f5f2ec','#0c0b0e',true),
      ['.xy-dialog-narration','margin:11px 2px;color:rgba(228,230,236,.85);line-height:1.75;white-space:pre-wrap;word-break:break-word'],
      ['@media(max-width:640px){.xy-dialog-bubble-wrap{gap:11px}.xy-dialog-avatar{width:44px;height:44px;flex-basis:44px}.xy-dialog-text{padding:14px 14px 12px 15px}.xy-dialog-user .xy-dialog-text{padding:14px 15px 12px 14px}}',''],
    ];
  },
},

};

const LS='xy-bubble-sandbox-v3';
let cur='p5';
const PARAMS={};
for(const k in SCHEMES){ PARAMS[k]={}; for(const pk in SCHEMES[k].params) PARAMS[k][pk]=SCHEMES[k].params[pk].def; }
try{ const s=JSON.parse(localStorage.getItem(LS)||'null');
  if(s&&s.cur&&SCHEMES[s.cur]) cur=s.cur;
  if(s&&s.params) for(const k in s.params){ if(PARAMS[k]) for(const pk in s.params[k]){ if(pk in PARAMS[k]) PARAMS[k][pk]=s.params[k][pk]; } }
}catch(e){}
if(!SCHEMES[cur]) cur=Object.keys(SCHEMES)[0];

/* ---------- CSS 组装 ---------- */
function buildCss(scheme,p,scoped){
  const rules=SCHEMES[scheme].gen(p);
  let out=scoped?'':'/* 气泡样式 · '+SCHEMES[scheme].label+' · 气泡校准台 v4（TW 生态动效混合） */\n';
  let hasAnim=false;
  for(const [sel,body] of rules){
    if(sel.startsWith('@keyframes')){ out+=sel+'\n'; hasAnim=true; continue; } // keyframes 原样（xy 前缀名防撞）
    if(sel.startsWith('@media')){
      if(scoped){
        const inner=sel.slice(sel.indexOf('{')+1,-1);
        out+=inner.replace(/(^|\})\s*(\.[a-z])/g,'$1#pv.narrow $2')+'\n';
      } else out+=sel+'\n';
      continue;
    }
    if(body==='')continue;
    out+=(scoped?'#pv ':'')+sel+'{'+body.replace(/;\+''/g,'')+'}\n';
  }
  if(hasAnim) out+='@media(prefers-reduced-motion:reduce){'+(scoped?'#pv ':'')+'.xy-dialog-bubble-wrap,'+(scoped?'#pv ':'')+'.xy-dialog-bubble-wrap *,'+(scoped?'#pv ':'')+'.xy-dialog-bubble-wrap *::before,'+(scoped?'#pv ':'')+'.xy-dialog-bubble-wrap *::after{animation:none!important}}\n';
  return out;
}

/* ---------- 预览样本（DOM 逐字照 buildDialogBubbleEl / buildDialogNarrationEl） ---------- */
/* 空头像：中性灰阶剪影（无媒体命中时的兜底形态；原星月 DIALOG_PLACEHOLDER 抽象图已弃） */
const PLACEHOLDER='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" fill="#23262c"/><circle cx="48" cy="38" r="15" fill="#454b56"/><path d="M18 88c5-21 20-31 30-31s25 10 30 31" fill="#454b56"/></svg>');
const AVA_NPC='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b5f8a"/><stop offset="1" stop-color="#6a4a7d"/></linearGradient></defs><rect width="96" height="96" fill="url(#g)"/><circle cx="48" cy="38" r="17" fill="#dce8f5" opacity=".85"/><path d="M18 88c5-22 21-32 30-32s25 10 30 32" fill="#dce8f5" opacity=".7"/></svg>');

const AVATARS={'林衡':AVA_NPC,'苏晚':AVA_NPC2,'我':PLACEHOLDER};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function bubbleHtml(kind,name,text){

/* ---------- 面板 ---------- */
function buildSchemeSeg(){
  $('#schemeseg').innerHTML=Object.keys(SCHEMES).map(k=>
    '<button data-s="'+k+'"'+(k===cur?' class="on"':'')+'>'+SCHEMES[k].label+'</button>').join('');
}
function buildPanel(){
  const sc=SCHEMES[cur], p=PARAMS[cur];
  $('#schemedesc').innerHTML='<b>'+sc.label+'</b>'+sc.desc;
  let h='<div class="rows">';
  for(const k in sc.params){
    const d=sc.params[k];
    if(d.t==='c'){
      h+='<div class="crow"><label>'+d.label+'</label><input type="color" data-k="'+k+'" value="'+p[k]+'"><span></span><span class="num" style="border:none;background:none">'+p[k]+'</span></div>';
    } else {
      h+='<div class="row"><label>'+d.label+'</label><input type="range" data-k="'+k+'" min="'+d.min+'" max="'+d.max+'" step="'+d.step+'" value="'+p[k]+'"><input class="num" data-k="'+k+'" value="'+p[k]+'"></div>';
    }
  }
  h+='</div>';
  $('#panel').innerHTML=h;
}

/* ---------- 应用 ---------- */
const liveStyle=document.createElement('style'); document.head.appendChild(liveStyle);
function apply(){
  liveStyle.textContent=buildCss(cur,PARAMS[cur],true);
  $('#cssout').value=buildCss(cur,PARAMS[cur],false);
  try{localStorage.setItem(LS,JSON.stringify({cur,params:PARAMS}));}catch(e){}
}

/* ---------- 事件 ---------- */
$('#schemeseg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  cur=b.dataset.s;
  $('#schemeseg .on')?.classList.remove('on'); b.classList.add('on');
  buildPanel(); apply();
});
$('#panel').addEventListener('input',e=>{
  const k=e.target.getAttribute('data-k'); if(!k)return;
  let v;
  if(e.target.type==='color'){ v=e.target.value; const lbl=e.target.closest('.crow')?.querySelector('.num'); if(lbl)lbl.textContent=v; }
  else { v=parseFloat(e.target.value); if(isNaN(v))return; }
  PARAMS[cur][k]=v;
  document.querySelectorAll('#panel [data-k="'+k+'"]').forEach(el=>{if(el!==e.target&&el.tagName==='INPUT')el.value=PARAMS[cur][k];});
  apply();
});
$('#wseg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  $('#wseg .on').classList.remove('on'); b.classList.add('on');
  const pv=$('#pv'); pv.className=b.dataset.w||'';
  pv.classList.toggle('narrow', b.dataset.w==='w640'||b.dataset.w==='w380');
});
$('#resetbtn').addEventListener('click',()=>{
  for(const pk in SCHEMES[cur].params) PARAMS[cur][pk]=SCHEMES[cur].params[pk].def;
  buildPanel(); apply();
});
$('#copybtn').addEventListener('click',async()=>{
  const t=$('#cssout').value;
  try{await navigator.clipboard.writeText(t);}catch(e){$('#cssout').select();document.execCommand('copy');}
  const toast=$('#toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400);
});
$('#pv').addEventListener('click',e=>{
  const img=e.target.closest('.xy-dialog-avatar img'); if(!img)return;
  const spk=img.getAttribute('data-spk');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f)return;
    const url=URL.createObjectURL(f); AVATARS[spk]=url;
    document.querySelectorAll('#pv .xy-dialog-avatar img[data-spk="'+CSS.escape(spk)+'"]').forEach(i=>i.src=url);
  };
  inp.click();
});

/* ---------- 启动 ---------- */
buildStage(); buildSchemeSeg(); buildPanel(); apply();
</script>
