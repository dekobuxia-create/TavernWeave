<div data-phopen-root style="margin:14px 0;padding:18px 16px;max-width:100%;box-sizing:border-box;border-radius:18px;background:linear-gradient(165deg,#10131b,#0a0d13);border:.5px solid rgba(211,173,99,.28);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
  <span style="width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,#171a22,#0d0f16);border:1px solid rgba(211,173,99,.55);display:flex;align-items:center;justify-content:center;color:#d3ad63;font-size:16px">✎</span>
  <div><div style="font-size:15px;font-weight:600;color:rgba(255,255,255,.92);letter-spacing:.5px">小手机</div><div style="font-size:11px;color:rgba(255,255,255,.35)">开局设定 · 舞台</div></div>
</div>
<div style="font-size:12px;color:rgba(255,255,255,.5);line-height:1.7;margin:10px 0 12px">写下故事发生的地方——留空则由剧情安排一座大城市。这是舞台的起点。</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:100%">
  <input data-phopen="国家" placeholder="国家（默认：本国）" style="min-width:0;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.88);font-size:13px;outline:none">
  <input data-phopen="省份" placeholder="省份/州" style="min-width:0;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.88);font-size:13px;outline:none">
  <input data-phopen="城市" placeholder="城市" style="min-width:0;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.88);font-size:13px;outline:none">
  <input data-phopen="具体地点" placeholder="具体地点（小区/街区）" style="min-width:0;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.88);font-size:13px;outline:none">
</div>
<div style="display:flex;align-items:center;gap:10px;margin-top:11px;max-width:100%">
  <button type="button" data-phopen-go style="min-width:0;flex:1;padding:11px;border-radius:11px;border:none;background:#d3ad63;color:#2a1f08;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:1px">写入设定，开始</button>
  <button type="button" data-phopen-skip style="flex:0 0 auto;padding:11px 14px;border-radius:11px;border:.5px solid rgba(255,255,255,.14);background:none;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;font-family:inherit">跳过</button>
</div>
<div data-phopen-tip role="status" aria-live="polite" style="display:none;font-size:11px;color:#d3ad63;padding:7px 2px 0"></div>
</div>
